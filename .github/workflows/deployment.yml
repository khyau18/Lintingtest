
name: Shared Deployment Blueprint
 
on:

  workflow_call:

    inputs:

      environment-name:

        required: true

        type: string

        description: "The targeted GitHub environment name (e.g., dev, uat, prod)"
 
permissions:

  contents: read
 
jobs:

  deploy:

    name: Deploy to ${{ inputs.environment-name }}

    runs-on: ubuntu-latest

    environment: ${{ inputs.environment-name }}

    # if: |

    #   github.ref == 'refs/heads/main' &&

    #   github.event.workflow_run.conclusion == 'success'
 
    steps:

      - name: Download Build Artifact

        uses: actions/download-artifact@v4

        with:

          name: node-app
 
      - name: Verify Build Artifact

        run: test -f dist/index.js

       # 2. Copy compiled dist/, package.json, and package-lock.json to the VM

      - name: Copy build files to Windows VM via SCP

        uses: appleboy/scp-action@v0.1.7

        with:

          host: ${{ secrets.VM_HOST }}

          username: ${{ secrets.VM_USER }}

          password: ${{ secrets.VM_PASSWORD }}

          source: "dist/**,package.json,package-lock.json"

          target: "C:/apps/my-ts-app-100"
 
      # 3. Install production-only dependencies on the VM and restart PM2

      - name: Install prod dependencies and restart PM2 via SSH

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.VM_HOST }}

          username: ${{ secrets.VM_USER }}

          password: ${{ secrets.VM_PASSWORD }}

          script: |

            powershell -Command "

              cd C:\apps\my-ts-app-100;

              npm ci --omit=dev;

              pm2 restart my-ts-app || pm2 start dist/index.js --name my-ts-app;

              pm2 save

            "
 
CICD pipeline:
 
name: Demo CICD Multi-Stage Deployment

on:

  workflow_run:

    workflows: ["Demo CI Pipeline"] # 🌟 CRUCIAL: Match the exact name field from the top of the CI workflow

    types:

      - completed              # Triggers when the target workflow completely finishes running

permissions:

  id-token: write # 🌟 Required for requesting the JWT OIDC token

  contents: read  # 🌟 Required for actions/checkout

jobs:

  # Call your completely separate existing CI file

  ci:

    uses: ./.github/workflows/demo-ci.yml
 
  # =========================================================================

  # DEPLOY TO DEV (REUSING TEMPLATE)

  # =========================================================================

  deploy-dev:

    name: Dev Stage

    needs: ci    

    uses: ./.github/workflows/deploy-template.yml

    with:

      environment-name: 'dev' 

    # 🌟 Explicitly maps the secret permission layer to the template

    secrets: inherit
 
  # =========================================================================

  # DEPLOY TO UAT (REUSING TEMPLATE)

  # =========================================================================

  deploy-uat:

    name: UAT Stage

    needs: deploy-dev     

    uses: ./.github/workflows/deploy-template.yml

    with:

      environment-name: 'uat'    

    # 🌟 Explicitly maps the secret permission layer to the template

    secrets: inherit 

  # =========================================================================

  # DEPLOY TO PROD (REUSING TEMPLATE)

  # =========================================================================

  deploy-prod:

    name: Prod Stage

    needs: deploy-uat   

    uses: ./.github/workflows/deploy-template.yml

    with:

      environment-name: 'prod'  

    # 🌟 Explicitly maps the secret permission layer to the template

    secrets: inherit
 
